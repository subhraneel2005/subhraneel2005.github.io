<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting to Spotify...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0b09;
      color: #f0ebe3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #2a1f18;
      border-top-color: #d4a373;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #b8a99a; font-size: 0.95rem; }
    .error { color: #e8a0b4; margin-top: 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Connecting to Spotify...</p>
    <p class="error" id="error"></p>
  </div>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');

      if (error) {
        localStorage.setItem('spotify_error', error);
        window.location.href = '/#/cafe';
        return;
      }

      if (!code) {
        localStorage.setItem('spotify_error', 'No authorization code received');
        window.location.href = '/#/cafe';
        return;
      }

      const verifier = localStorage.getItem('spotify_code_verifier');
      if (!verifier) {
        localStorage.setItem('spotify_error', 'Session expired. Please try again.');
        window.location.href = '/#/cafe';
        return;
      }

      try {
        const res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            code,
            redirect_uri: 'https://subhraneel2005.github.io/callback.html',
            client_id: 'a98267df6a1b44049b3f83b70528c18f',
            code_verifier: verifier,
          }),
        });

        const data = await res.json();

        if (data.access_token) {
          localStorage.setItem('spotify_access_token', data.access_token);
          if (data.refresh_token) {
            localStorage.setItem('spotify_refresh_token', data.refresh_token);
          }
          localStorage.setItem('spotify_token_expires', String(Date.now() + data.expires_in * 1000));
          localStorage.removeItem('spotify_code_verifier');
        } else {
          localStorage.setItem('spotify_error', JSON.stringify(data));
        }
      } catch (err) {
        localStorage.setItem('spotify_error', err.message);
      }

      window.location.href = '/#/cafe';
    })();
  </script>
</body>
</html>
